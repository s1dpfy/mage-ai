<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>물건 가치 측정기</title>
    <style>
        body {
            margin: 0;
            padding: 30px;
            text-align: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
        }
        h1 {
            margin-top: 80px;
            margin-bottom: 10px;
            font-size: 28px;
        }
        p {
            color: #666;
            margin-bottom: 35px;
            font-size: 15px;
        }
        input {
            width: 85%;
            max-width: 400px;
            padding: 15px;
            font-size: 18px;
            border: 1px solid #ccc;
            border-radius: 12px;
            box-sizing: border-box;
        }
        button {
            margin-top: 20px;
            padding: 15px 40px;
            font-size: 18px;
            border: none;
            border-radius: 12px;
            background: #222;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        button:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body>
    <h1>📦 물건 가치 측정기</h1>
    <p>사진을 찍으면 AI가 순식간에 가치를 감정해 드립니다.</p>

    <form method="POST" action="/start">
        <input
            type="text"
            name="username"
            placeholder="아이디를 입력하세요"
            maxlength="20"
            required
            autocomplete="off"
        >
        <br>
        <button type="submit">시작하기</button>
    </form>
</body>
</html>
