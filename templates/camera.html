<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>가치 측정기</title>
    <!-- Pretendard 폰트 적용 -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard-dynamic-subset.css" />
    
    <style>
        :root {
            --primary: #3182f6;
            --primary-hover: #1b64da;
            --bg-color: #f2f4f6;
            --surface: #ffffff;
            --text-main: #191f28;
            --text-sub: #8b95a1;
            --danger: #f04452;
            --border: #e5e8eb;
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 12px;
            --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 10px 20px rgba(0, 0, 0, 0.08);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: #e5e8eb;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        #app-container {
            width: 100%;
            max-width: 480px;
            background: var(--bg-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
            overflow: hidden;
        }

        header {
            padding: 24px 20px 16px;
            background: var(--bg-color);
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }
        h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.5px; color: var(--text-main); }
        .user-badge {
            background: #e8f3ff;
            color: var(--primary);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
        }

        main { padding: 0 20px 100px; flex: 1; }

        #video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 3/4;
            background: #000;
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            margin-top: 10px;
        }
        #video, #preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }
        
        #scanner {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(49, 130, 246, 0.1);
            z-index: 10;
        }
        #scanner-line {
            width: 100%;
            height: 4px;
            background: var(--primary);
            box-shadow: 0 0 10px var(--primary);
            position: absolute;
            animation: scan 1.5s infinite alternate ease-in-out;
        }
        @keyframes scan {
            0% { top: 0; }
            100% { top: calc(100% - 4px); }
        }

        .controls {
            position: fixed;
            bottom: 0; left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            padding: 20px;
            background: linear-gradient(to top, rgba(242,244,246,1) 60%, rgba(242,244,246,0));
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 20;
        }

        .btn {
            flex: 1;
            padding: 16px 20px;
            border-radius: var(--radius-md);
            font-size: 16px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            letter-spacing: -0.3px;
        }
        .btn:active { transform: scale(0.96); }
        
        .btn-primary { background: var(--primary); color: white; box-shadow: 0 4px 14px rgba(49, 130, 246, 0.3); }
        .btn-primary:hover { background: var(--primary-hover); }
        
        .btn-secondary { background: var(--surface); color: var(--text-main); border: 1px solid var(--border); }
        .btn-danger { background: var(--text-main); color: white; display: none; }
        
        /* 카메라 전환 버튼 (SVG 아이콘 적용) */
        .btn-switch { 
            background: rgba(0,0,0,0.5); 
            color: white; 
            position: absolute; 
            bottom: 16px; 
            right: 16px; 
            width: 44px; 
            height: 44px; 
            border-radius: 50%; 
            border: none;
            padding: 0; 
            display: none; 
            z-index: 15; 
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-switch:active { background: rgba(0,0,0,0.7); }
        .btn-switch svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

        #loading-text {
            text-align: center;
            font-size: 15px;
            font-weight: 600;
            color: var(--primary);
            margin-top: 16px;
            display: none;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        #result-box {
            display: none;
            margin-top: 20px;
            background: var(--surface);
            padding: 24px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            animation: slideUp 0.4s ease-out;
        }
        .res-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .badge {
            background: #f2f4f6; color: var(--text-sub); font-size: 13px; font-weight: 600;
            padding: 6px 12px; border-radius: 20px;
        }
        .item-name { font-size: 15px; color: var(--text-sub); font-weight: 500; }
        .price { font-size: 32px; font-weight: 800; color: var(--text-main); margin-bottom: 16px; letter-spacing: -1px; }
        .reason-box {
            background: #f9fafb; padding: 16px; border-radius: var(--radius-sm);
            font-size: 14px; color: var(--text-main); line-height: 1.5; font-weight: 500;
            border: 1px solid var(--border);
        }

        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(4px);
            z-index: 1000; justify-content: center; align-items: flex-end;
            opacity: 0; transition: opacity 0.3s;
        }
        .modal-overlay.show { display: flex; opacity: 1; }
        
        .modal-content {
            background: var(--surface); width: 100%; max-width: 480px; max-height: 85vh;
            border-radius: 24px 24px 0 0; padding: 24px 20px; display: flex; flex-direction: column;
            transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .modal-overlay.show .modal-content { transform: translateY(0); }

        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-title { font-size: 18px; font-weight: 800; color: var(--text-main); }
        .btn-close { 
            background: var(--bg-color); border: none; border-radius: 50%; width: 32px; height: 32px; 
            cursor: pointer; color: var(--text-sub); display: flex; align-items: center; justify-content: center; 
        }
        .btn-close svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }

        .ranking-list { overflow-y: auto; flex: 1; padding-bottom: 20px; margin: 0 -10px; padding: 0 10px; }
        .rank-item {
            display: flex; align-items: center; padding: 16px 12px;
            border-bottom: 1px solid var(--border); gap: 12px;
        }
        .rank-item:last-child { border-bottom: none; }
        .rank-num { width: 28px; font-size: 15px; font-weight: 700; color: var(--text-sub); text-align: center; }
        .rank-1 { color: var(--primary); font-size: 16px; font-weight: 800; }
        .rank-2 { color: var(--text-main); font-size: 16px; font-weight: 800; }
        .rank-3 { color: var(--text-main); font-size: 16px; font-weight: 800; }
        
        .rank-info { flex: 1; display: flex; flex-direction: column; gap: 4px; }
        .rank-user { font-size: 14px; font-weight: 700; color: var(--text-main); }
        .rank-obj { font-size: 13px; color: var(--text-sub); }
        .rank-price { font-size: 16px; font-weight: 800; color: var(--text-main); text-align: right; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        #canvas { display: none; }
    </style>
</head>
<body>
    <div id="app-container">
        <header>
            <h1>가치 측정기</h1>
            <div class="user-badge" id="current-user">{{ username }}</div>
        </header>

        <main>
            <div id="video-container">
                <div id="placeholder" style="position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); color:var(--text-sub); font-weight:600; text-align:center; width:100%; font-size: 14px;">
                    하단 카메라 켜기 버튼을 눌러주세요
                </div>
                
                <video id="video" autoplay playsinline muted></video>
                <img id="preview">
                
                <button id="btn-switch" class="btn-switch" onclick="switchCamera()" aria-label="카메라 전환">
                    <svg viewBox="0 0 24 24"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
                </button>
                
                <div id="scanner">
                    <div id="scanner-line"></div>
                </div>
            </div>

            <div id="loading-text">AI 분석 중입니다...</div>

            <div id="result-box">
                <div class="res-header">
                    <div class="item-name" id="res-name">식별 대상</div>
                    <span class="badge" id="res-tag">태그</span>
                </div>
                <div class="price" id="res-price">0원</div>
                <div class="reason-box" id="res-reason">이유가 표시됩니다.</div>
            </div>
        </main>

        <div class="controls">
            <button id="btn-start" class="btn btn-primary" onclick="startCamera()">카메라 켜기</button>
            <button id="btn-snap" class="btn btn-danger" onclick="takeSnapshot()">가치 측정하기</button>
            <button class="btn btn-secondary" onclick="openRankingModal()">명예의 전당 보기</button>
        </div>

        <div id="ranking-modal" class="modal-overlay">
            <div class="modal-content">
                <div class="modal-header">
                    <div class="modal-title">가치 랭킹</div>
                    <button class="btn-close" onclick="closeRankingModal()">
                        <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"></path></svg>
                    </button>
                </div>
                <div class="ranking-list" id="ranking-list">
                    <div style="text-align:center; padding:40px 0; color:var(--text-sub); font-weight:500; font-size:14px;">데이터를 불러오는 중입니다.</div>
                </div>
            </div>
        </div>

        <canvas id="canvas"></canvas>
    </div>

    <script>
        const video = document.getElementById("video");
        const canvas = document.getElementById("canvas");
        const preview = document.getElementById("preview");
        const btnStart = document.getElementById("btn-start");
        const btnSwitch = document.getElementById("btn-switch");
        const btnSnap = document.getElementById("btn-snap");
        const loadingText = document.getElementById("loading-text");
        const resultBox = document.getElementById("result-box");
        const scanner = document.getElementById("scanner");
        const placeholder = document.getElementById("placeholder");
        
        const modal = document.getElementById("ranking-modal");
        const rankingList = document.getElementById("ranking-list");
        const username = document.getElementById("current-user").innerText;

        let stream = null;
        let currentFacingMode = "environment";

        async function openRankingModal() {
            modal.style.display = "flex";
            setTimeout(() => modal.classList.add("show"), 10); 
            
            rankingList.innerHTML = '<div style="text-align:center; padding:40px 0; color:var(--text-sub); font-weight:500; font-size:14px;">데이터 갱신 중입니다.</div>';
            
            try {
                const res = await fetch("/api/rankings");
                const list = await res.json();

                if (list.length === 0) {
                    rankingList.innerHTML = '<div style="text-align:center; padding:40px 0; color:var(--text-sub); font-weight:500; font-size:14px;">아직 측정된 기록이 없습니다.</div>';
                    return;
                }

                rankingList.innerHTML = list.map(item => `
                    <div class="rank-item">
                        <div class="rank-num ${item.rank <= 3 ? 'rank-' + item.rank : ''}">${item.rank}</div>
                        <div class="rank-info">
                            <span class="rank-user">${item.username}</span>
                            <span class="rank-obj">${item.name}</span>
                        </div>
                        <div class="rank-price">${item.price}</div>
                    </div>
                `).join('');
            } catch (err) {
                rankingList.innerHTML = '<div style="text-align:center; padding:40px 0; color:var(--danger); font-weight:500; font-size:14px;">랭킹 조회에 실패했습니다.</div>';
            }
        }

        function closeRankingModal() {
            modal.classList.remove("show");
            setTimeout(() => modal.style.display = "none", 300);
        }

        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeRankingModal();
        });

        async function openCameraStream(mode) {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }

            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { ideal: mode }, width: { ideal: 1080 } },
                    audio: false
                });
                
                placeholder.style.display = "none";
                video.srcObject = stream;
                video.style.display = "block";
                preview.style.display = "none";
                resultBox.style.display = "none";

                btnStart.style.display = "none";
                btnSwitch.style.display = "flex";
                btnSnap.style.display = "flex";
            } catch (err) {
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    placeholder.style.display = "none";
                    video.srcObject = stream;
                    video.style.display = "block";
                    preview.style.display = "none";
                    
                    btnStart.style.display = "none";
                    btnSnap.style.display = "flex";
                } catch (fallbackErr) {
                    alert("카메라 권한을 허용해주세요. (HTTPS 환경 필요)");
                }
            }
        }

        function startCamera() {
            openCameraStream(currentFacingMode);
        }

        function switchCamera() {
            currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
            openCameraStream(currentFacingMode);
        }

        function takeSnapshot() {
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext("2d");

            if (currentFacingMode === "user") {
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
            }

            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            preview.src = canvas.toDataURL("image/jpeg");
            preview.style.display = "block";
            video.style.display = "none";
            
            btnSnap.style.display = "none";
            btnSwitch.style.display = "none";
            btnStart.style.display = "flex";
            btnStart.innerText = "다시 찍기";

            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }

            loadingText.style.display = "block";
            scanner.style.display = "block";
            resultBox.style.display = "none";

            canvas.toBlob(async function(blob) {
                const formData = new FormData();
                formData.append("username", username);
                formData.append("file", blob, "photo.jpg");

                try {
                    const response = await fetch("/evaluate", {
                        method: "POST",
                        body: formData
                    });
                    const data = await response.json();
                    
                    loadingText.style.display = "none";
                    scanner.style.display = "none";

                    if (response.ok) {
                        document.getElementById("res-tag").innerText = data.tag;
                        document.getElementById("res-name").innerText = data.name;
                        document.getElementById("res-price").innerText = data.price;
                        document.getElementById("res-reason").innerText = data.reason;
                        resultBox.style.display = "block";
                    } else {
                        alert("분석 실패: " + (data.detail || "오류가 발생했습니다."));
                    }
                } catch (e) {
                    loadingText.style.display = "none";
                    scanner.style.display = "none";
                    alert("서버와 통신할 수 없습니다.");
                }
            }, "image/jpeg", 0.85);
        }
    </script>
</body>
</html>
