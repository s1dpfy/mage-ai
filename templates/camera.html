<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>물건 가치 측정기</title>
    <style>
        body {
            margin: 0;
            padding: 20px 15px;
            text-align: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
        }
        h1 { margin-bottom: 5px; font-size: 26px; }
        .username {
            font-size: 16px;
            color: #555;
            margin-bottom: 15px;
        }
        .btn-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-block;
            padding: 12px 20px;
            background: #222;
            color: white;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }
        .btn:active { transform: scale(0.97); }
        .btn-capture { background: #e53e3e; display: none; }
        .btn-switch { background: #4a5568; display: none; }
        .btn-rank { background: #3182ce; }

        #video-container {
            margin: 15px auto;
            max-width: 420px;
        }
        #video, #preview {
            width: 100%;
            max-height: 380px;
            border-radius: 15px;
            background: #000;
            object-fit: cover;
            display: none;
        }
        #canvas { display: none; }

        /* 결과 카드 */
        #result-box {
            display: none;
            margin: 20px auto;
            max-width: 420px;
            background: #fff;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        .badge {
            display: inline-block;
            background: #FFE8E5;
            color: #FF5252;
            font-size: 13px;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 20px;
            margin-bottom: 8px;
        }
        .item-name {
            font-size: 18px;
            font-weight: bold;
            color: #222;
        }
        .price {
            font-size: 32px;
            font-weight: 900;
            color: #e53e3e;
            margin: 8px 0;
        }
        .reason {
            font-size: 13px;
            color: #555;
            line-height: 1.4;
            background: #fafafa;
            padding: 10px;
            border-radius: 8px;
        }
        #loading {
            display: none;
            font-size: 17px;
            font-weight: bold;
            color: #222;
            margin: 15px 0;
        }

        /* 📋 전체 랭킹 모달 폼 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background: #ffffff;
            border-radius: 18px;
            width: 90%;
            max-width: 480px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: left;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            padding-bottom: 12px;
            margin-bottom: 10px;
        }
        .modal-title {
            font-size: 18px;
            font-weight: 800;
            color: #222;
        }
        .btn-close {
            background: #eee;
            border: none;
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        .modal-body {
            overflow-y: auto;
            flex: 1;
        }
        .ranking-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        .ranking-table th {
            background: #f8f9fa;
            padding: 10px 8px;
            color: #555;
            font-weight: 700;
            border-bottom: 1px solid #ddd;
        }
        .ranking-table td {
            padding: 12px 8px;
            border-bottom: 1px solid #eee;
            vertical-align: middle;
        }
        .rank-num {
            font-weight: bold;
            color: #777;
            text-align: center;
            width: 35px;
        }
        .rank-1 { color: #f59e0b; font-size: 16px; }
        .rank-2 { color: #94a3b8; font-size: 15px; }
        .rank-3 { color: #b45309; font-size: 15px; }
        .rank-user { font-weight: bold; color: #222; display: block; }
        .rank-item-name { font-size: 12px; color: #777; }
        .rank-price {
            font-weight: 800;
            color: #e53e3e;
            text-align: right;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <h1>📦 물건 가치 측정기</h1>
    <div class="username">접속 아이디: <b id="current-user">{{ username }}</b></div>

    <div class="btn-group">
        <button id="btn-start" class="btn" onclick="startCamera()">📷 카메라 켜기</button>
        <button id="btn-switch" class="btn btn-switch" onclick="switchCamera()">🔄 전환</button>
        <button id="btn-snap" class="btn btn-capture" onclick="takeSnapshot()">📸 촬영하기</button>
        <button class="btn btn-rank" onclick="openRankingModal()">🏆 전체 랭킹 보기</button>
    </div>

    <div id="loading">⚡ AI가 순식간에 감정하고 랭킹 등록 중...</div>

    <div id="video-container">
        <video id="video" autoplay playsinline muted></video>
        <img id="preview">
    </div>

    <canvas id="canvas"></canvas>

    <!-- 내 측정 결과 카드 -->
    <div id="result-box">
        <span class="badge" id="res-tag">#감정완료</span>
        <div class="item-name" id="res-name">식별 대상</div>
        <div class="price" id="res-price">0원</div>
        <div class="reason" id="res-reason">이유</div>
    </div>

    <!-- 🏆 전체 랭킹 모달 폼 -->
    <div id="ranking-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title">🏆 물건 가치 명예의 전당</span>
                <button class="btn-close" onclick="closeRankingModal()">✕ 닫기</button>
            </div>
            <div class="modal-body">
                <table class="ranking-table">
                    <thead>
                        <tr>
                            <th style="text-align:center;">순위</th>
                            <th>등록자 / 감정 물건</th>
                            <th style="text-align:right;">측정 가치</th>
                        </tr>
                    </thead>
                    <tbody id="ranking-tbody">
                        <tr>
                            <td colspan="3" style="text-align:center; padding:20px; color:#999;">
                                랭킹을 불러오는 중...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById("video");
        const canvas = document.getElementById("canvas");
        const preview = document.getElementById("preview");
        const btnStart = document.getElementById("btn-start");
        const btnSwitch = document.getElementById("btn-switch");
        const btnSnap = document.getElementById("btn-snap");
        const loading = document.getElementById("loading");
        const resultBox = document.getElementById("result-box");
        const modal = document.getElementById("ranking-modal");
        const tbody = document.getElementById("ranking-tbody");
        const username = document.getElementById("current-user").innerText;

        let stream = null;
        let currentFacingMode = "environment";

        // --- 랭킹 모달 제어 ---
        async function openRankingModal() {
            modal.style.display = "flex";
            tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; padding:20px; color:#999;">데이터 갱신 중...</td></tr>';
            
            try {
                const res = await fetch("/api/rankings");
                const list = await res.json();

                if (list.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; padding:20px; color:#999;">아직 측정된 기록이 없습니다.</td></tr>';
                    return;
                }

                tbody.innerHTML = list.map(item => `
                    <tr>
                        <td class="rank-num ${item.rank <= 3 ? 'rank-' + item.rank : ''}">${item.rank}</td>
                        <td>
                            <span class="rank-user">${item.username}</span>
                            <span class="rank-item-name">${item.name}</span>
                        </td>
                        <td class="rank-price">${item.price}</td>
                    </tr>
                `).join('');
            } catch (err) {
                tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; padding:20px; color:#e53e3e;">랭킹 조회 실패</td></tr>';
            }
        }

        function closeRankingModal() {
            modal.style.display = "none";
        }

        // 배경 클릭 시 모달 닫기
        window.onclick = function(event) {
            if (event.target === modal) {
                closeRankingModal();
            }
        };

        // --- 카메라 제어 ---
        async function openCameraStream(mode) {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }

            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { ideal: mode }, width: { ideal: 1280 } },
                    audio: false
                });
                video.srcObject = stream;
                video.style.display = "block";
                preview.style.display = "none";
                resultBox.style.display = "none";

                btnStart.style.display = "none";
                btnSwitch.style.display = "inline-block";
                btnSnap.style.display = "inline-block";
            } catch (err) {
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    video.srcObject = stream;
                    video.style.display = "block";
                    preview.style.display = "none";
                    btnStart.style.display = "none";
                    btnSwitch.style.display = "inline-block";
                    btnSnap.style.display = "inline-block";
                } catch (fallbackErr) {
                    alert("카메라 연결 실패: " + err.message);
                }
            }
        }

        function startCamera() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                alert("카메라 권한을 얻을 수 없습니다. HTTPS 주소로 접속했는지 확인하세요.");
                return;
            }
            openCameraStream(currentFacingMode);
        }

        function switchCamera() {
            currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
            openCameraStream(currentFacingMode);
        }

        function takeSnapshot() {
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext("2d");

            if (currentFacingMode === "user") {
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
            }

            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            preview.src = canvas.toDataURL("image/jpeg");
            preview.style.display = "block";
            video.style.display = "none";
            btnSnap.style.display = "none";
            btnSwitch.style.display = "none";
            btnStart.style.display = "inline-block";
            btnStart.innerText = "🔄 다시 찍기";

            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }

            loading.style.display = "block";
            resultBox.style.display = "none";

            canvas.toBlob(async function(blob) {
                const formData = new FormData();
                formData.append("username", username);
                formData.append("file", blob, "photo.jpg");

                try {
                    const response = await fetch("/evaluate", {
                        method: "POST",
                        body: formData
                    });
                    const data = await response.json();
                    loading.style.display = "none";

                    if (response.ok) {
                        document.getElementById("res-tag").innerText = "#" + data.tag;
                        document.getElementById("res-name").innerText = data.name;
                        document.getElementById("res-price").innerText = data.price;
                        document.getElementById("res-reason").innerText = "💬 " + data.reason;
                        resultBox.style.display = "block";
                    } else {
                        alert("분석 실패: " + (data.detail || "오류 발생"));
                    }
                } catch (e) {
                    loading.style.display = "none";
                    alert("서버 통신 실패");
                }
            }, "image/jpeg", 0.85);
        }
    </script>
</body>
</html>
