<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>가치 측정기</title>
    <!-- Pretendard 폰트 적용 -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard-dynamic-subset.css" />
    
    <style>
        :root {
            --primary: #3182f6;
            --primary-hover: #1b64da;
            --bg-color: #f2f4f6;
            --surface: #ffffff;
            --text-main: #191f28;
            --text-sub: #8b95a1;
            --danger: #f04452;
            --border: #e5e8eb;
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 12px;
            --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 10px 20px rgba(0, 0, 0, 0.08);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: #e5e8eb;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        #app-container {
            width: 100%;
            max-width: 480px;
            background: var(--bg-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
            overflow: hidden;
        }

        header {
            padding: 24px 20px 16px;
            background: var(--bg-color);
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }
        h1 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
        .user-badge {
            background: #e8f3ff;
            color: var(--primary);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
        }

        main { padding: 0 20px 100px; flex: 1; }

        #video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 3/4;
            background: #000;
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            margin-top: 10px;
        }
        #video, #preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }
        
        #scanner {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(49, 130, 246, 0.1);
            z-index: 10;
        }
        #scanner-line {
            width: 100%;
            height: 4px;
            background: var(--primary);
            box-shadow: 0 0 10px var(--primary);
            position: absolute;
            animation: scan 1.5s infinite alternate ease-in-out;
        }
        @keyframes scan {
            0% { top: 0; }
            100% { top: calc(100% - 4px); }
        }

        .controls {
            position: fixed;
            bottom: 0; left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            padding: 20px;
            background: linear-gradient(to top, rgba(242,244,246,1) 60%, rgba(242,244,246,0));
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 20;
        }

        .btn {
            flex: 1;
            padding: 16px 20px;
            border-radius: var(--radius-md);
            font-size: 16px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .btn:active { transform: scale(0.96); }
        
        .btn-primary { background: var(--primary); color: white; box-shadow: 0 4px 14px rgba(49, 130, 246, 0.3); }
        .btn-primary:hover { background: var(--primary-hover); }
        
        .btn-secondary { background: var(--surface); color: var(--text-main); border: 1px solid var(--border); }
        .btn-danger { background: var(--text-main); color: white; display: none; }
        
        /* 카메라 전환 버튼 (SVG 적용) */
        .btn-switch { 
            background: rgba(0,0,0,0.5); 
            color: white; 
            position: absolute; 
            bottom: 16px; 
            right: 16px; 
            width: 44px; 
            height: 44px; 
            border-radius: 50%; 
            border: none;
            padding: 0; 
            display: none; 
            z-index: 15; 
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .btn-switch svg { width: 22px; height: 22px; }

        #loading-text {
            text-align: center;
            font-size: 15px;
            font-weight: 600;
            color: var(--primary);
            margin-top: 16px;
            display: none;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        #result-box {
            display: none;
            margin-top: 20px;
            background: var(--surface);
            padding: 24px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            animation: slideUp 0.4s ease-out;
        }
        .res-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .badge {
            background: #fff0f1; color: var(--danger); font-size: 12px; font-weight: 700;
            padding: 6px 12px; border-radius: 20px;
        }
        .item-name { font-size: 15px; color: var(--text-sub); font-weight: 500; }
        .price { font-size: 36px; font-weight: 800; color: var(--text-main); margin-bottom: 16px; letter-spacing: -1px; }
        .reason-box {
            background: #f9fafb; padding: 16px; border-radius: var(--radius-sm);
            font-size: 14px; color: var(--text-main); line-height: 1.5; font-weight: 500;
            border: 1px solid var(--border);
        }

        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(4px);
            z-index: 1000; justify-content: center; align-items: flex-end;
            opacity: 0; transition: opacity 0.3s;
        }
        .modal-overlay.show { display: flex; opacity: 1; }
        
        .modal-content {
            background: var(--surface); width: 100%; max-width: 480px; max-height: 85vh;
            border-radius: 24px 24px 0 0; padding: 24px 20px; display: flex; flex-direction: column;
            transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .modal-overlay.show .modal-content { transform: translateY(0); }

        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-title { font-size: 20px; font-weight: 800; }
        .btn-close { background: var(--bg-color); border: none; border-radius: 50%; width: 32px; height: 32px; font-size: 16px; font-weight: bold; cursor: pointer; color: var(--text-sub); display: flex; align-items: center; justify-content: center; }

        .ranking-list { overflow-y: auto; flex: 1; padding-bottom: 20px; margin: 0 -10px; padding: 0 10px; }
        .rank-item {
            display: flex; align-items: center; padding: 16px 12px;
            border-bottom: 1px solid var(--border); gap: 12px;
        }
        .rank-item:last-child { border-bottom: none; }
        .rank-num { width: 28px; font-size: 16px; font-weight: 800; color: var(--text-sub); text-align: center; }
        .rank-1 { color: #f59e0b; font-size: 18px; }
        .rank-2 { color: #9ca3af; font-size: 18px; }
        .rank-3 { color: #b45309; font-size: 18px; }
        .rank-img { width: 56px; height: 56px; border-radius: 12px; object-fit: cover; background: #e5e8eb; }
        .rank-info { flex: 1; }
        .rank-name { font-size: 14px; color: var(--text-sub); margin-bottom: 4px; font-weight: 500; }
        .rank-price { font-size: 17px; font-weight: 700; color: var(--text-main); }
        .rank-user { font-size: 12px; color: var(--primary); font-weight: 600; padding: 4px 8px; background: #e8f3ff; border-radius: 12px; }알겠습니다. 이모지 다 빼고 담백하고 자연스럽게 답변할게요. 더 필요한 게 있으면 편하게 말씀해 주세요.
